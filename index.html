<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎤이장선화의 노래책🎤</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background -->
  <div class="bg-sky" aria-hidden="true"></div>
  <div class="bg-pattern" aria-hidden="true"></div>

  <header class="hero">
    <div class="heroCard">
      <div class="heroTop">
        <img class="avatar" src="baekseonhwa.png" alt="백선화" />
        <div class="heroText">
          <h1>🎤이장선화의 노래책🎤</h1>
          <p>장르 · 가수 · 제목 정렬 / 난이도(★) 필터</p>
        </div>
      </div>

      <div class="heroControls">
        <input id="search" type="text" placeholder="검색: 제목/가수/장르" />

        <!-- 당근농장 느낌: 별 버튼이 가로로 쭉 -->
        <div class="starsBar" role="group" aria-label="난이도 필터">
          <button class="starBtn" data-star="all" type="button">전체</button>
          <button class="starBtn" data-star="1" type="button">★</button>
          <button class="starBtn" data-star="2" type="button">★★</button>
          <button class="starBtn" data-star="3" type="button">★★★</button>
          <button class="starBtn" data-star="4" type="button">★★★★</button>
          <button class="starBtn" data-star="5" type="button">★★★★★</button>
        </div>

        <!-- 기존 select도 유지(모바일/접근성용). 숨겨도 되는데 그냥 살려둠 -->
        <select id="starFilter" class="hiddenSelect" aria-label="난이도 선택">
          <option value="all">전체</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>

        <div class="sortBar">
          <button class="chip sort" data-sort="genre" type="button">장르</button>
          <button class="chip sort" data-sort="singer" type="button">가수</button>
          <button class="chip sort" data-sort="title" type="button">제목</button>
          <button class="chip sort" data-sort="stars" type="button">난이도</button>
          <button id="sortDir" class="chip dir" type="button">오름차순</button>

          <span id="count" class="count">0곡</span>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="tableCard">
      <table class="table">
        <thead>
          <tr>
            <th class="thSort" data-sort="genre">장르</th>
            <th class="thSort" data-sort="singer">가수</th>
            <th class="thSort" data-sort="title">제목</th>
            <th class="thSort" data-sort="stars">난이도</th>
          </tr>
        </thead>
        <tbody id="songList"></tbody>
      </table>
    </section>

    <footer class="footer">
      <span>TIP: 별 버튼으로 필터 → 헤더 클릭으로 정렬</span>
    </footer>
  </main>

  <script src="script.js"></script>

  <!-- 별 버튼을 기존 starFilter(select)랑 동기화 -->
  <script>
    (function () {
      const select = document.getElementById("starFilter");
      const btns = document.querySelectorAll(".starBtn");

      function setActive(v){
        btns.forEach(b => b.classList.toggle("active", b.dataset.star === v));
      }
      setActive("all");

      btns.forEach(btn => {
        btn.addEventListener("click", () => {
          const v = btn.dataset.star;
          select.value = v;
          setActive(v);
          select.dispatchEvent(new Event("change"));
        });
      });

      select.addEventListener("change", () => setActive(select.value));
    })();
  </script>
</body>
</html>
