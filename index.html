<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸백쨈의 노래자랑🌸</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-soft"></div>
<div class="bg-dots"></div>

<header class="hero">
  <img src="baekseonhwa.png" class="avatar" alt="백쨈">
  <h1>🌸백쨈의 노래자랑🌸</h1>

  <input id="search" type="text" placeholder="검색: 제목 / 가수 / 장르">

  <div class="starsBar">
    <button class="starBtn active" data-star="all">전체</button>
    <button class="starBtn" data-star="1">★</button>
    <button class="starBtn" data-star="2">★★</button>
    <button class="starBtn" data-star="3">★★★</button>
    <button class="starBtn" data-star="4">★★★★</button>
    <button class="starBtn" data-star="5">★★★★★</button>
  </div>

  <select id="starFilter" class="hiddenSelect">
    <option value="all">전체</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>
</header>

<main class="wrap">
  <table class="table">
    <thead>
      <tr>
        <th class="thSort" data-sort="genre">🎶장르</th>
        <th class="thSort" data-sort="singer">👩‍🎤가수</th>
        <th class="thSort" data-sort="title">🎤제목</th>
        <th class="thSort" data-sort="stars">★난이도</th>
      </tr>
    </thead>
    <tbody id="songList"></tbody>
  </table>
</main>

<script src="script.js"></script>
<script>
const select = document.getElementById("starFilter");
const btns = document.querySelectorAll(".starBtn");

btns.forEach(btn => {
  btn.onclick = () => {
    select.value = btn.dataset.star;
    select.dispatchEvent(new Event("change"));
    btns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  };
});
</script>
</body>
</html>
