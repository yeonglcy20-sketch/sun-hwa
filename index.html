<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎤이장선화의 노래책🎤</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
<div class="bg-bokeh" aria-hidden="true"></div>
<div class="bg-petals" aria-hidden="true"></div>

  
  <header class="topbar">
    <div class="brand">
      <img class="avatar" src="baekseonhwa.png" alt="백선화" />
      <div class="brandText">
        <h1>🎤이장선화의 노래책🎤</h1>
        <p>백선화 테마 · 스프레드시트 연동 · 검색/필터/정렬</p>
      </div>
    </div>

    <div class="topActions">
      <button id="viewToggle" class="btn ghost" type="button">카드 보기</button>
      <button id="themeToggle" class="btn ghost" type="button">다크 모드</button>
    </div>
  </header>

  <main class="container">
    <section class="panel glass">
      <div class="controls">
        <div class="field">
          <label>검색</label>
          <input id="search" type="text" placeholder="제목/가수/장르 검색..." />
        </div>

        <div class="field">
          <label>난이도</label>
          <select id="starFilter">
            <option value="all">전체</option>
            <option value="1">★ 1</option>
            <option value="2">★ 2</option>
            <option value="3">★ 3</option>
            <option value="4">★ 4</option>
            <option value="5">★ 5</option>
          </select>
        </div>

        <div class="field">
          <label>정렬</label>
          <div class="sortRow">
            <button class="chip sort" data-sort="genre" type="button">장르</button>
            <button class="chip sort" data-sort="singer" type="button">가수</button>
            <button class="chip sort" data-sort="title" type="button">제목</button>
            <button class="chip sort" data-sort="stars" type="button">난이도</button>
            <button id="sortDir" class="chip dir" type="button">오름차순</button>
          </div>
        </div>
      </div>

      <div class="meta">
        <span id="count" class="count">0곡</span>
        <span id="activeSort" class="activeSort">정렬: 없음</span>
      </div>
    </section>

    <section id="tableView" class="panel glass tablePanel">
      <div class="tableWrap">
        <table class="table">
          <thead>
            <tr>
              <th class="thSort" data-sort="genre">장르</th>
              <th class="thSort" data-sort="singer">가수</th>
              <th class="thSort" data-sort="title">제목</th>
              <th class="thSort" data-sort="stars">난이도</th>
            </tr>
          </thead>
          <tbody id="songList"></tbody>
        </table>
      </div>
    </section>

    <section id="cardView" class="panel glass cardPanel hidden">
      <div id="cardList" class="cards"></div>
    </section>

    <footer class="footer">
      <span class="hint">TIP: 정렬 버튼을 눌러 정렬!</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
