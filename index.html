<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎤이장선화의 노래책🎤</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 🌸 Baek Seonhwa Background Layers -->
<div class="bg-gradient" aria-hidden="true"></div>
<div class="bg-bokeh" aria-hidden="true"></div>
<div class="bg-petals" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <img class="avatar" src="baekseonhwa.png" alt="백선화" />
    <div class="brandText">
      <h1>🎤이장선화의 노래책🎤</h1>
      <p>백선화 테마 · 스프레드시트 연동</p>
    </div>
  </div>
</header>

<main class="container">
  <table class="table">
    <thead>
      <tr>
        <th>장르</th>
        <th>가수</th>
        <th>제목</th>
        <th>난이도</th>
      </tr>
    </thead>
    <tbody id="songList"></tbody>
  </table>
</main>

<script src="script.js"></script>
</body>
</html>
